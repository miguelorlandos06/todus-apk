name: Update Todus APK
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar APK
        run: |
          curl -L -o toDus_latest.apk https://s3.todus.cu/official/todus/release/rel/toDus_latest.apk
          echo "Última actualización: $(date -u)" > last_update.txt
      - name: Commit y push automático
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]users.noreply.github.com"
          git add toDus_latest.apk last_update.txt
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Update APK $(date -u)"
          git push origin main
